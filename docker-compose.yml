name: express-ts-starter

services:
    server-app:
        container_name: server-app
        build:
            context: .
            dockerfile: ./dockerfiles/production/Dockerfile
        image: express_ts_starter:latest
        restart: always
        ports:
            - 8000:8000
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - fetch('http://localhost:'+(process.env.PORT||8000)+'/api/v1/health').then(r=>{if(!r.ok)throw 0}).catch(()=>process.exit(1))
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 15s
        # All secrets live in the env file — never inline them here.
        env_file: ./env/.env.production.local
        environment:
            PORT: 8000
            NODE_ENV: production
            DATABASE_URL: postgresql://dev:dev@postgres:5432/expressts
        networks:
            - express-ts-starter-network
        depends_on:
            - postgres
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M

    postgres:
        container_name: postgres
        image: postgres:15-alpine
        restart: always
        environment:
            POSTGRES_USER: dev
            POSTGRES_PASSWORD: dev
            POSTGRES_DB: expressts
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - express-ts-starter-network
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M

networks:
    express-ts-starter-network:
        name: express-ts-starter-network
        driver: bridge

volumes:
    postgres-data:
        name: postgres-data
