type: object
properties:
  id:
    type: string
    format: uuid
    example: "68c1869b-dac1-4822-b5fe-365618ed4914"
  name:
    type: string
    example: "John Doe"
  phoneNumber:
    type: string
    example: "1234567890"
  email:
    type: string
    format: email
    example: "john@example.com"
  avatar:
    type: string
    nullable: true
    example: null
  bio:
    type: string
    nullable: true
    example: null

  createdAt:
    type: string
    format: date-time
    example: "2026-08-01T16:04:44.334Z"
  updatedAt:
    type: string
    format: date-time
    example: "2026-08-01T16:04:44.334Z"
