get:
  summary: List users
  tags: [Users]
  security: [{ bearerAuth: [] }]
  parameters:
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    - in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    '200':
      description: Paginated users (empty list returns success with empty array)
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/UserListEnvelope'
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '403': { $ref: '../../components/schemas/ErrorResponse.yaml#/Forbidden' }
post:
  summary: Create a user
  tags: [Users]
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/User.yaml#/CreateUserInput'
  responses:
    '201':
      description: User created (password hashed server-side)
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/UserEnvelope'
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '403': { $ref: '../../components/schemas/ErrorResponse.yaml#/Forbidden' }
    '409':
      description: Phone number or email already exists
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml#/ErrorResponse'
