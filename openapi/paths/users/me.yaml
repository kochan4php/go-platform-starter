get:
  summary: Get current authenticated user
  tags: [Users]
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: Authenticated user profile (from access token)
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/UserEnvelope'
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '404': { $ref: '../../components/schemas/ErrorResponse.yaml#/NotFound' }
