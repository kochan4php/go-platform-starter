get:
  summary: Readiness probe (checks database)
  tags: [Health]
  security: []
  responses:
    '200':
      description: Database reachable
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Envelope.yaml#/Envelope'
    '503':
      description: Database unreachable
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml#/ErrorResponse'
