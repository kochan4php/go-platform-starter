get:
  summary: List the permission catalog
  description: All permission names known to the system. Routes referencing anything outside this catalog fail at boot.
  tags: [Roles]
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: Permission catalog
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/PermissionListEnvelope'
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '403': { $ref: '../../components/schemas/ErrorResponse.yaml#/Forbidden' }
