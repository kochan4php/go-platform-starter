get:
  summary: List roles
  tags: [Roles]
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: Roles
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/RoleListEnvelope'
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '403': { $ref: '../../components/schemas/ErrorResponse.yaml#/Forbidden' }
post:
  summary: Create a role
  tags: [Roles]
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            permissions:
              type: array
              items: { type: string }
              description: Permission names to grant this role at creation time
  responses:
    '201':
      description: Role created
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/RoleEnvelope'
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '403': { $ref: '../../components/schemas/ErrorResponse.yaml#/Forbidden' }
