get:
  summary: Get all permissions for a specific role
  tags:
    - Roles
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: The role ID
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: true
              message:
                type: string
                example: "Success"
              data:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
    '401':
      description: Unauthorized
    '403':
      description: Forbidden (Requires role:view:any permission)
    '404':
      description: Role not found
