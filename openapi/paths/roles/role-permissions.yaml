get:
  summary: List a role's permissions
  tags: [Roles]
  security: [{ bearerAuth: [] }]
  parameters:
    - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
  responses:
    '200':
      description: Permissions granted to the role
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/PermissionListEnvelope'
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '403': { $ref: '../../components/schemas/ErrorResponse.yaml#/Forbidden' }
    '404': { $ref: '../../components/schemas/ErrorResponse.yaml#/NotFound' }
put:
  summary: Replace a role's permissions
  tags: [Roles]
  security: [{ bearerAuth: [] }]
  parameters:
    - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items: { type: string }
              example: ['user:read:any', 'role:read:any']
  responses:
    '200':
      description: Permission set replaced (fails if any name is unknown)
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/Envelope'
    '400': { $ref: '../../components/schemas/ErrorResponse.yaml#/ErrorResponse' }
    '401': { $ref: '../../components/schemas/ErrorResponse.yaml#/Unauthorized' }
    '403': { $ref: '../../components/schemas/ErrorResponse.yaml#/Forbidden' }
    '404': { $ref: '../../components/schemas/ErrorResponse.yaml#/NotFound' }
