post:
  summary: Login
  description: Accepts email or phone number as loginType. Returns JWT tokens and sets the httpOnly session cookie. Always responds with a uniform error to prevent user enumeration.
  tags: [Auth]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [loginType, password]
          properties:
            loginType: { type: string, example: jane@example.com }
            password: { type: string, format: password }
  responses:
    '200':
      description: Authenticated; sets httpOnly session cookie
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/TokensEnvelope'
    '401':
      description: Invalid credentials (uniform response)
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml#/ErrorResponse'
