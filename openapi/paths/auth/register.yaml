post:
  summary: Register a new user
  tags: [Auth]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name, phoneNumber, email, password]
          properties:
            name: { type: string, example: Jane Doe }
            phoneNumber: { type: string, example: '081234567890' }
            email: { type: string, format: email, example: jane@example.com }
            password: { type: string, format: password, minLength: 6 }
  responses:
    '201':
      description: User created
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/UserEnvelope'
    '409':
      description: Email already registered
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml#/ErrorResponse'
