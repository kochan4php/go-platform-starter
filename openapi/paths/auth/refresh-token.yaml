get:
  summary: Refresh tokens (rotates session)
  description: Requires the httpOnly session cookie set at login.
  tags: [Auth]
  security: []
  parameters:
    - in: cookie
      name: session-backend
      required: true
      schema: { type: string }
  responses:
    '200':
      description: New access + refresh tokens issued; session cookie rotated
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/TokensEnvelope'
    '401':
      description: Missing/invalid/expired session
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml#/ErrorResponse'
