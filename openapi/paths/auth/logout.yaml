delete:
  summary: Logout (revokes session)
  tags: [Auth]
  security: []
  parameters:
    - in: cookie
      name: session-backend
      required: true
      schema: { type: string }
  responses:
    '200':
      description: Session deleted, cookie cleared
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml#/Envelope'
    '401':
      description: Missing/invalid session
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml#/ErrorResponse'
