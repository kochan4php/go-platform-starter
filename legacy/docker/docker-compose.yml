version: '3.8'

name: expressts_db_dev

services:
    postgres:
        container_name: postgres
        image: postgres:15-alpine
        restart: always
        environment:
            POSTGRES_USER: dev
            POSTGRES_PASSWORD: dev
            POSTGRES_DB: expressts
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
        name: postgres-data
