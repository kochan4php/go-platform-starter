version: "2"

linters:
  enable:
    - depguard
    - gosec
  settings:
    depguard:
      rules:
        shared-code-must-not-import-services:
          files:
            - "**/internal/**"
            - "!**/services/**"
          deny:
            - pkg: "github.com/kochan4php/go-platform-starter/services"
              desc: shared code must never depend on a service; services depend on it
        testutil-must-not-import-services:
          files:
            - "**/testutil/**"
          deny:
            - pkg: "github.com/kochan4php/go-platform-starter/services"
              desc: the harness must never depend on a specific service

  exclusions:
    rules:
      # Close on a deferred reader/connection and Fprint to a stream are
      # idiomatically unchecked in Go; errcheck flags ~36 of them repo-wide.
      - linters:
          - errcheck
        text: 'Error return value of .[^`]*\.Close. is not checked'
      - linters:
          - errcheck
        text: 'Error return value of .fmt\.Fprint'

formatters:
  enable:
    - gofumpt
