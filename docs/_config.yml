# Jekyll configuration for GitHub Pages.
#
# Pages is configured as "Deploy from a branch" -> main -> /docs, so GitHub's
# own build renders this directory with Jekyll. The MkDocs config at the repo
# root still builds the same content in CI as a link-and-nav check; it no
# longer publishes anything. Keep mkdocs.yml's nav and the nav_order/parent
# front matter in these pages in step, or the two will describe different
# structures.
title: Go Platform Starter
description: >-
  Production-shaped Go microservices, a React micro-frontend shell, spec-first
  OpenAPI contracts, PostgreSQL schema ownership, and Redis Streams in one
  repository.
url: https://kochan4php.github.io
baseurl: /go-platform-starter

# v0.10.1 is pinned deliberately: remote_theme follows a git ref, so an
# unpinned theme can change the published site without a commit here.
remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  # Rewrites the repository's relative *.md links to their rendered URLs. Every
  # internal link in these docs is written as a path to a real file so that
  # scripts/check-docs.mjs can resolve it; without this plugin each one would
  # 404 on the published site.
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

relative_links:
  enabled: true
  collections: false

# Matches mkdocs.yml's exclude_docs so both renderings publish the same set.
# BACKLOG.md is a 68 KB working document, not a reference page.
exclude:
  - BACKLOG.md
  - archive/
  - testing/badges/

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  Repository: https://github.com/kochan4php/go-platform-starter
aux_links_new_tab: true

# "Edit this page" sends readers to the file they are reading.
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/kochan4php/go-platform-starter
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

color_scheme: light

footer_content: >-
  Generated references under <code>docs/reference/</code> are written by
  <code>scripts/generate-docs.mjs</code>; edit the source, not the page.

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
