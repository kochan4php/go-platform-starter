name: Feature request
description: Propose a user or operator outcome
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current pain without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and constraints
      description: Frequency, affected users, security/data constraints, and alternatives tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the backlog and existing issues for duplicates.
          required: true
