name: Bug report
description: Report something broken in the template as shipped
labels: ['bug']
body:
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
      validations:
          required: true
    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Setup / quick start
              - Auth (login/register/reset/lockout)
              - RBAC / permissions
              - Database / migrations / seeders
              - OpenAPI docs (/docs)
              - Realtime (Socket.IO)
              - Docker / k8s / Jenkins
              - Tests
              - Other
      validations:
          required: true
    - type: input
      id: node-version
      attributes:
          label: Node version
          placeholder: '24.x'
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs or output
          render: shell
