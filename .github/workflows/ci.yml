name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m

      - name: Build
        run: make build

      - name: Test (container tests included; Docker is available on runners)
        run: make test

      - name: Generated code is fresh
        run: |
          make contracts SVC=_template
          git diff --exit-code
