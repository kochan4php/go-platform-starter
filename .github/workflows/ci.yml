name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m

      - name: Build
        run: make build

      - name: Validate YAML manifests
        run: go run ./cmd/yamlcheck $(find .github infra services apps -type f \( -name '*.yml' -o -name '*.yaml' \))

      - name: Test (container tests included; Docker is available on runners)
        run: make test

      - name: Hot-path benchmark smoke
        run: go test ./internal/platform ./services/users/internal -run '^$' -bench . -benchtime=100ms -benchmem

      - name: Generated code is fresh
        run: |
          make contracts SVC=_template
          git diff --exit-code

      - name: Zero-downtime migration policy
        run: scripts/check-migration-safety.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Import boundaries
        run: pnpm check:deps

      - name: Test (Vitest + RTL)
        run: pnpm test

      - name: Contracts are fresh
        run: |
          pnpm contracts
          git diff --exit-code

  web-build:
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        app: [web, web-auth, web-admin-users, web-admin-roles]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build
      - name: Bundle-size budget
        if: matrix.app == 'web'
        run: pnpm check:budget
      - name: Lighthouse performance budget
        if: matrix.app == 'web'
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/web/lighthouserc.json

  docker-build:
    runs-on: ubuntu-latest
    needs: [go, web-build]
    strategy:
      fail-fast: false
      matrix:
        component: [auth, users, rbac, worker, realtime, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.component }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  playwright:
    # Full-journey smoke against the real mesh (PLAN item 67).
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install web deps + browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Boot the mesh and run the smoke journey
        env:
          E2E_ADMIN_EMAIL: admin@example.local
          E2E_ADMIN_PASSWORD: e2e-root-access-2026!
        run: |
          chmod +x scripts/e2e-mesh.sh
          scripts/e2e-mesh.sh ci

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability + misconfig scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,config
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy Kubernetes manifest scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (default + project rules)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --config p/default --config /src/.semgrep.yml --error --exclude-rule generic.secrets.security.detected-generic-secret

      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Dependency license policy
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
