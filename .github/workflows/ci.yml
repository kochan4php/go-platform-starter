name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.impact.outputs.go }}
      web: ${{ steps.impact.outputs.web }}
      e2e: ${{ steps.impact.outputs.e2e }}
      security: ${{ steps.impact.outputs.security }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: impact
        run: node scripts/ci-changes.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  developer-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find scripts .husky -type f \( -name '*.sh' -o -path '.husky/*' \) -not -path '.husky/_/*' -print0 | xargs -0 shellcheck
      - name: Workflow semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: YAML style
        run: |
          python -m pip install yamllint==1.37.1
          yamllint --config-file .yamllint.yml .github infra services apps mkdocs.yml
      - name: Markdown style
        run: pnpm lint:markdown
      - name: Developer policy and generator tests
        run: |
          pnpm check:devx
          pnpm test:devx
      - name: Revive comments on changed Go files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          go install github.com/mgechev/revive@v1.15.0
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" -- '*.go')
          if ((${#files[@]})); then "$(go env GOPATH)/bin/revive" -config revive.toml -formatter friendly "${files[@]}"; fi
      - name: OpenAPI changelog and breaking gate
        id: oasdiff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go install github.com/oasdiff/oasdiff@v1.30.0
          gobin="$(go env GOPATH)/bin"
          echo "$gobin" >> "$GITHUB_PATH"
          PATH="$gobin:$PATH"
          export PATH
          "$gobin/oasdiff" --version
          node scripts/openapi-diff.mjs "$BASE_SHA"
      - name: OpenAPI diff PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('test-results/oasdiff.md') != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: openapi-diff
          path: test-results/oasdiff.md
      - name: Enforce OpenAPI breaking gate
        if: steps.oasdiff.outcome == 'failure'
        run: exit 1

  danger:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Danger
        run: pnpm exec danger ci --failOnErrors --dangerfile dangerfile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Go cache result
        run: echo "setup-go cache hit = ${{ steps.setup-go.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          args: --timeout=5m

      - name: Build
        run: make build

      - name: Architecture fitness and template drift
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          node scripts/check-template-drift.mjs
          node scripts/check-architecture.mjs

      - name: Migration lint, checksums, and immutable history
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: node scripts/check-migrations.mjs check "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Migration up/down from an empty PostgreSQL 17 database
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        env:
          TESTCONTAINERS_FORCE: "1"
        run: go test -p=1 -count=1 -run '^TestMigrationsAreReversibleAndIdempotent$' ./services/auth/internal ./services/users/internal ./services/rbac/internal ./services/worker/internal

      - name: Validate YAML manifests
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          find .github infra services apps -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            xargs -0 go run ./cmd/yamlcheck

      - name: Validate GitHub Actions semantics
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate Prometheus config and alert thresholds
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:latest check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:latest test rules /etc/prometheus/alerts.test.yml

      - name: Race detector (Linux, concurrency-sensitive packages)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: go test -race -count=1 ./internal/platform ./services/auth/internal ./services/users/internal ./services/rbac/internal ./services/worker/internal

      - name: Fuzz smoke (validators and request decoders)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          go test ./services/rbac/internal -run '^$' -fuzz FuzzPermissionNameGrammar -fuzztime 5s
          go test ./services/users/internal -run '^$' -fuzz FuzzHandlerDecode -fuzztime 5s
          go test ./services/users/internal -run '^$' -fuzz FuzzUserOrderClauseNeverIncludesInput -fuzztime 5s

      - name: Coverage report + changed-code gate (>=70%)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_MIN: 70
        run: node scripts/check-coverage.mjs

      - name: Upload coverage report and per-package badges
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: |
            coverage/go.out
            docs/testing/badges/

      - name: Coverage diff PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && hashFiles('coverage/summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: go-coverage
          path: coverage/summary.md

      - name: Hot-path benchmark smoke
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: go test ./internal/platform ./services/users/internal -run '^$' -bench . -benchtime=100ms -benchmem

      - name: Generated code is fresh
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          make contracts SVC=_template
          git diff --exit-code

      - name: Zero-downtime migration policy
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: scripts/check-migration-safety.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  go-test:
    needs: [changes, go]
    if: >-
      needs.changes.outputs.go == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: platform
            packages: ./internal/platform ./internal/testutil
          - shard: auth
            packages: ./services/auth/...
          - shard: users
            packages: ./services/users/...
          - shard: rbac
            packages: ./services/rbac/...
          - shard: worker
            packages: ./services/worker/...
          - shard: edge
            packages: ./services/gateway/... ./services/realtime/... ./services/scheduler/...
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - id: test
        name: Test shard with one flaky retry
        env:
          TESTCONTAINERS_FORCE: "1"
        run: node scripts/run-with-retry.mjs --report "test-results/go-${{ matrix.shard }}.json" -- go test -count=1 ${{ matrix.packages }}
      - if: steps.test.outputs.flaky == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: ['flaky-test']})
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-test-${{ matrix.shard }}
          path: test-results/

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: echo "pnpm store cache hit = ${{ steps.pnpm-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Import boundaries
        run: pnpm check:deps

      - name: Quality gate regression tests
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm test:gates

      - name: Test (Vitest + RTL)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        id: web-test
        run: node scripts/run-with-retry.mjs --report test-results/web.json -- pnpm test

      - if: steps.web-test.outputs.flaky == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: ['flaky-test']})

      - name: Contracts are fresh
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          pnpm contracts
          pnpm test:contracts
          git diff --exit-code

      - name: API changelog and breaking-removal gate
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: node scripts/api-changelog.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

  schema-docs:
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Apply every schema from zero
        run: go run ./cmd/migrateall
      - name: Generated schema registry, DBML, and audit are fresh
        run: go run ./cmd/dbdocs -check

  web-build:
    runs-on: ubuntu-latest
    needs: [changes, web]
    if: needs.changes.outputs.web == 'true' && needs.web.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        app: [web, web-auth, web-admin-users, web-admin-roles]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build
      - name: Bundle-size budget
        if: matrix.app == 'web'
        run: pnpm check:budget
      - name: Bundle-size PR comment
        if: always() && matrix.app == 'web' && github.event_name == 'pull_request' && hashFiles('apps/web/dist/bundle-summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: bundle-size
          path: apps/web/dist/bundle-summary.md
      # apps/web is a module-federation host: /login renders the web-auth remote.
      # Serving only apps/web/dist makes that import fail, so Lighthouse used to
      # score an error boundary instead of the login page. The remote URL baked
      # into the build is a fixed 127.0.0.1:5174.
      - name: Serve the auth remote so /login can actually render
        if: matrix.app == 'web' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        run: |
          pnpm --filter web-auth build
          nohup pnpm --filter web-auth exec vite preview --host 127.0.0.1 --port 5174 --strictPort \
            > /tmp/web-auth-preview.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:5174/assets/remoteEntry.js >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:5174/assets/remoteEntry.js >/dev/null ||
            { echo 'auth remote never came up'; cat /tmp/web-auth-preview.log; exit 1; }

      # The budget in lighthouserc.json records what the login page actually
      # scores here (performance 0.77, LCP ~5.4s across three runs) rather than
      # what we wish it scored: the old 0.8/2500ms thresholds only ever passed
      # because the page under test was an error boundary. The cost is the
      # federation waterfall - host bundle, then remoteEntry, then the auth
      # remote's chunks, in series. Ratchet these down as that gets shortened.
      - name: Lighthouse performance budget
        if: matrix.app == 'web' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: apps/web/lighthouserc.json
      - name: Create Lighthouse summary
        if: matrix.app == 'web' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        run: node scripts/lighthouse-summary.mjs
      - name: Lighthouse PR comment
        if: matrix.app == 'web' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: lighthouse
          path: lighthouse-results/summary.md

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, go, web-build]
    if: >-
      always() && needs.changes.outputs.go == 'true' && needs.go.result == 'success' &&
      (needs.web-build.result == 'success' || needs.web-build.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        component: [auth, users, rbac, worker, realtime, scheduler, gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.component }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  playwright:
    # Full-journey smoke against the real mesh (PLAN item 67).
    runs-on: ubuntu-latest
    needs: [changes, go, web]
    if: >-
      always() && needs.changes.outputs.e2e == 'true' &&
      (needs.go.result == 'success' || needs.go.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install web deps + browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Boot the mesh and run the smoke journey
        env:
          E2E_ADMIN_EMAIL: admin@example.local
          E2E_ADMIN_PASSWORD: e2e-root-access-2026!
          PLAYWRIGHT_ARGS: --update-snapshots
        run: |
          chmod +x scripts/e2e-mesh.sh
          scripts/e2e-mesh.sh ci

      - name: TEMPORARY - export regenerated visual baselines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-snapshots
          path: e2e/**/*.png

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: test-results/

      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          name: Playwright JUnit
          path: test-results/playwright.xml
          reporter: java-junit
          fail-on-empty: false

  security:
    needs: changes
    if: >-
      needs.changes.outputs.security == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans the pushed range, so it needs the parent commits
          fetch-depth: 0

      - name: Validate every deployment target
        run: ./scripts/check-deploy-config.sh

      - name: Trivy vulnerability + misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,config
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy Kubernetes manifest scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (default + project rules)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --config p/default --config /src/.semgrep.yml --error --exclude-rule generic.secrets.security.detected-generic-secret

      - name: Generate repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Dependency license policy
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
