name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m

      - name: Build
        run: make build

      - name: Architecture fitness and template drift
        run: |
          node scripts/check-template-drift.mjs
          node scripts/check-architecture.mjs

      - name: Migration lint, checksums, and immutable history
        run: node scripts/check-migrations.mjs check "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Migration up/down from an empty PostgreSQL 17 database
        env:
          TESTCONTAINERS_FORCE: "1"
        run: go test -p=1 -count=1 -run '^TestMigrationsAreReversibleAndIdempotent$' ./services/auth/internal ./services/users/internal ./services/rbac/internal ./services/worker/internal

      - name: Validate YAML manifests
        run: go run ./cmd/yamlcheck $(find .github infra services apps -type f \( -name '*.yml' -o -name '*.yaml' \))

      - name: Validate Prometheus config and alert thresholds
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:latest check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:latest test rules /etc/prometheus/alerts.test.yml

      - name: Test (container tests included; Docker is available on runners)
        run: make test

      - name: Race detector (Linux, concurrency-sensitive packages)
        run: go test -race -count=1 ./internal/platform ./services/auth/internal ./services/users/internal ./services/rbac/internal ./services/worker/internal

      - name: Fuzz smoke (validators and request decoders)
        run: |
          go test ./services/rbac/internal -run '^$' -fuzz FuzzPermissionNameGrammar -fuzztime 5s
          go test ./services/users/internal -run '^$' -fuzz FuzzHandlerDecode -fuzztime 5s
          go test ./services/users/internal -run '^$' -fuzz FuzzUserOrderClauseNeverIncludesInput -fuzztime 5s

      - name: Coverage report + changed-code gate (>=70%)
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_MIN: 70
        run: node scripts/check-coverage.mjs

      - name: Upload coverage report and per-package badges
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage/go.out
            docs/testing/badges/

      - name: Hot-path benchmark smoke
        run: go test ./internal/platform ./services/users/internal -run '^$' -bench . -benchtime=100ms -benchmem

      - name: Generated code is fresh
        run: |
          make contracts SVC=_template
          git diff --exit-code

      - name: Zero-downtime migration policy
        run: scripts/check-migration-safety.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Import boundaries
        run: pnpm check:deps

      - name: Quality gate regression tests
        run: pnpm test:gates

      - name: Test (Vitest + RTL)
        run: pnpm test

      - name: Contracts are fresh
        run: |
          pnpm contracts
          pnpm test:contracts
          git diff --exit-code

      - name: API changelog and breaking-removal gate
        run: node scripts/api-changelog.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

  schema-docs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Apply every schema from zero
        run: go run ./cmd/migrateall
      - name: Generated schema registry, DBML, and audit are fresh
        run: go run ./cmd/dbdocs -check

  web-build:
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        app: [web, web-auth, web-admin-users, web-admin-roles]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build
      - name: Bundle-size budget
        if: matrix.app == 'web'
        run: pnpm check:budget
      - name: Lighthouse performance budget
        if: matrix.app == 'web'
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/web/lighthouserc.json

  docker-build:
    runs-on: ubuntu-latest
    needs: [go, web-build]
    strategy:
      fail-fast: false
      matrix:
        component: [auth, users, rbac, worker, realtime, scheduler, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.component }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  playwright:
    # Full-journey smoke against the real mesh (PLAN item 67).
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install web deps + browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Boot the mesh and run the smoke journey
        env:
          E2E_ADMIN_EMAIL: admin@example.local
          E2E_ADMIN_PASSWORD: e2e-root-access-2026!
        run: |
          chmod +x scripts/e2e-mesh.sh
          scripts/e2e-mesh.sh ci

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability + misconfig scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,config
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy Kubernetes manifest scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (default + project rules)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --config p/default --config /src/.semgrep.yml --error --exclude-rule generic.secrets.security.detected-generic-secret

      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Dependency license policy
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
