name: Images and registry

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: auth
            file: services/auth/Dockerfile
          - component: users
            file: services/users/Dockerfile
          - component: rbac
            file: services/rbac/Dockerfile
          - component: worker
            file: services/worker/Dockerfile
          - component: realtime
            file: services/realtime/Dockerfile
          - component: scheduler
            file: services/scheduler/Dockerfile
          - component: gateway
            file: services/gateway/Dockerfile
          - component: web
            file: apps/web/Dockerfile
          - component: web-auth
            file: apps/web-auth/Dockerfile
          - component: web-admin-users
            file: apps/web-admin-users/Dockerfile
          - component: web-admin-roles
            file: apps/web-admin-roles/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:buildcache,mode=max
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  rescan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [auth, users, rbac, worker, realtime, scheduler, gateway, web, web-auth, web-admin-users, web-admin-roles]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif

  retention:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [auth, users, rbac, worker, realtime, scheduler, gateway, web, web-auth, web-admin-users, web-admin-roles]
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/registry-retention.mjs "${{ matrix.component }}" --apply
