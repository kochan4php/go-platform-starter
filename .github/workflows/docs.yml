name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/generate-docs.mjs"
      - "scripts/check-docs.mjs"
      - "docs/assets/**"
      - "**/.env.example"
      - "**/docker-compose.yml"
      - "infra/compose*.yml"
      - "packages/contracts/gen/openapi.json"
      - "go.mod"
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/generate-docs.mjs"
      - "scripts/check-docs.mjs"
      - "docs/assets/**"
      - "**/.env.example"
      - "**/docker-compose.yml"
      - "infra/compose*.yml"
      - "packages/contracts/gen/openapi.json"
      - "go.mod"
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          # The docs requirements live in requirements-docs.txt; without this
          # setup-python looks for requirements.txt and fails the job.
          cache-dependency-path: requirements-docs.txt
      - run: pnpm install --frozen-lockfile
      - run: go mod download
      - run: python -m pip install -r requirements-docs.txt
      - name: Generate external status snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          STATUS_ENDPOINTS: ${{ vars.STATUS_ENDPOINTS }}
        run: node scripts/generate-status.mjs
      - name: Generated references and links
        run: |
          node scripts/generate-docs.mjs --check
          node scripts/check-docs.mjs
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
