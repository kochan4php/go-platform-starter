name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      candidate:
        description: Release-candidate tag, for example v1.4.0-rc.1
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          release-type: simple

  artifacts:
    needs: release-please
    if: >-
      always() && (github.event_name == 'release' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: go mod download
      - name: Build component changelogs
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          node scripts/component-changelog.mjs "$PREVIOUS" "$TAG" release-notes
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Package contracts, licenses, notes, and checksums
        run: |
          tar -czf "go-platform-starter-$TAG-artifacts.tar.gz" packages/contracts/gen/openapi.json docs/DEPENDENCY_LICENSES.md release-notes sbom.spdx.json
          sha256sum "go-platform-starter-$TAG-artifacts.tar.gz" > "go-platform-starter-$TAG-artifacts.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: go-platform-starter-${{ env.TAG }}-artifacts.tar.gz
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: gh release upload "$TAG" "go-platform-starter-$TAG-artifacts.tar.gz" "go-platform-starter-$TAG-artifacts.tar.gz.sha256" --clobber

  release-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.candidate }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "invalid RC tag: $TAG" >&2; exit 2; }
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          git tag -a "$TAG" -m "Release candidate $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --prerelease --generate-notes --title "$TAG"
