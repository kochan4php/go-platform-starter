name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options: [uat, demo, prod]
      revision:
        description: Commit, tag, or branch to promote
        required: false
        default: origin/main
      dry_run:
        description: Validate and print the promotion plan only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'uat' || github.event_name == 'schedule' && 'demo' || inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'uat' || github.event_name == 'schedule' && 'demo' || inputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'uat' || github.event_name == 'schedule' && 'demo' || inputs.environment }}
      REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check deployment credentials are configured
        id: creds
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Without a target host this workflow cannot do anything; say so once
          # instead of failing every push with an opaque ssh exit 255.
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_SSH_KEY/DEPLOY_HOST are not set; skipping promotion."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure pinned SSH host identity
        if: steps.creds.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Promote with backup, smoke, audit, and rollback
        if: steps.creds.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_ON_HOST: ${{ vars.DEPLOY_PATH }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |
          printf -v remote_command 'cd %q && ./scripts/promote.sh %q %q' "$PATH_ON_HOST" "$TARGET" "$REVISION"
          test -z "$DRY_RUN" || remote_command="$remote_command --dry-run"
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "$remote_command"

  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: uat
            url_variable: UAT_URL
          - environment: demo
            url_variable: DEMO_URL
          - environment: prod
            url_variable: PROD_URL
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare deployed revision with main
        env:
          DEPLOYED_URL: ${{ vars[matrix.url_variable] }}
        if: env.DEPLOYED_URL != ''
        run: ./scripts/check-deploy-drift.sh "$DEPLOYED_URL" "${{ github.sha }}"
