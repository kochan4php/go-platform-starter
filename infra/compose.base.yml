# LAB environment (docker compose): the full mesh for local development and
# debugging — every service port is published, seeds are included.
#
#   docker compose -f infra/compose.base.yml -f infra/compose.lab.yml up --build
# Seeded admin: admin@example.local / admin-bootstrap-pw
# Shell: http://localhost:5173 · API docs: http://localhost:8000/docs
name: go-platform-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Host side is configurable so the lab never fights other local projects
    # for the default Postgres/Redis ports.
    ports: ["${LAB_PG_PORT:-55432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["${LAB_REDIS_PORT:-56380}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  auth:
    build: { context: .., dockerfile: services/auth/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8081"
      APP_PUBLIC_URL: http://localhost:5173
      RBAC_INTERNAL_URL: http://rbac:8083
      # Interpolated from the caller so deploy-lab / CI can pin credentials.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin-bootstrap-pw}
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  users:
    build: { context: .., dockerfile: services/users/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8082"
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  rbac:
    build: { context: .., dockerfile: services/rbac/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8083"
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8084"
      MAILER_DRIVER: console
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  realtime:
    build: { context: .., dockerfile: services/realtime/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8085"
    ports: ["8085:8085"]
    depends_on:
      redis: { condition: service_healthy }

  gateway:
    build: { context: .., dockerfile: services/gateway/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8000"
      TRUSTED_DOMAINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
      UPSTREAMS: '{"auth":"http://auth:8081","users":"http://users:8082","rbac":"http://rbac:8083","worker":"http://worker:8084"}'
    # Host side shifts automatically when another project owns 8000.
    ports: ["${LAB_GATEWAY_PORT:-8010}:8000"]
    depends_on:
      - auth
      - users
      - rbac
      - worker

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    ports: ["5173:80"]
    environment:
      REMOTE_AUTH_URL: http://localhost:5174/assets/remoteEntry.js
      REMOTE_ADMIN_USERS_URL: http://localhost:5175/assets/remoteEntry.js
      REMOTE_ADMIN_ROLES_URL: http://localhost:5176/assets/remoteEntry.js

  web-auth:
    build: { context: .., dockerfile: apps/web-auth/Dockerfile }
    ports: ["5174:80"]

  web-admin-users:
    build: { context: .., dockerfile: apps/web-admin-users/Dockerfile }
    ports: ["5175:80"]

  web-admin-roles:
    build: { context: .., dockerfile: apps/web-admin-roles/Dockerfile }
    ports: ["5176:80"]

volumes:
  pgdata:
