# LAB environment (docker compose): the full mesh for local development and
# debugging — every service port is published, seeds are included.
#
#   docker compose -f infra/compose.base.yml -f infra/compose.lab.yml up --build
# Seeded admin: admin@example.local / local-root-access-2026!
# Shell: http://127.0.0.1:5173 · API docs: http://127.0.0.1:8010/docs
name: go-platform-lab

x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }

services:
  postgres:
    <<: *runtime
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Host side is configurable so the lab never fights other local projects
    # for the default Postgres/Redis ports.
    ports: ["${LAB_PG_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/observability.sql:/docker-entrypoint-initdb.d/20-observability.sql:ro
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
      start_interval: 1s

  redis:
    <<: *runtime
    image: redis:7-alpine
    ports: ["${LAB_REDIS_PORT:-56380}:6379"]
    command: ["redis-server", "--appendonly", "yes", "--io-threads", "4", "--io-threads-do-reads", "yes", "--lazyfree-lazy-eviction", "yes", "--lazyfree-lazy-expire", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  auth:
    <<: *runtime
    build: { context: .., dockerfile: services/auth/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8081"
      APP_PUBLIC_URL: http://127.0.0.1:5173
      RBAC_INTERNAL_URL: http://rbac:8083
      # Interpolated from the caller so deploy-lab / CI can pin credentials.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-local-root-access-2026!}
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  users:
    <<: *runtime
    build: { context: .., dockerfile: services/users/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8082"
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  rbac:
    <<: *runtime
    build: { context: .., dockerfile: services/rbac/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8083"
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *runtime
    build: { context: .., dockerfile: services/worker/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8084"
      MAILER_DRIVER: console
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  realtime:
    <<: *runtime
    build: { context: .., dockerfile: services/realtime/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8085"
    ports: ["8085:8085"]
    depends_on:
      redis: { condition: service_healthy }

  scheduler:
    <<: *runtime
    build: { context: .., dockerfile: services/scheduler/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8086"
      SCHEDULED_JOBS: ${SCHEDULED_JOBS:-[]}
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    <<: *runtime
    build: { context: .., dockerfile: services/gateway/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8000"
      TRUSTED_DOMAINS: http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176
      UPSTREAMS: '{"auth":"http://auth:8081","users":"http://users:8082","rbac":"http://rbac:8083","worker":"http://worker:8084"}'
    # Host side shifts automatically when another project owns 8000.
    ports: ["${LAB_GATEWAY_PORT:-8010}:8000"]
    depends_on:
      auth: { condition: service_healthy }
      users: { condition: service_healthy }
      rbac: { condition: service_healthy }
      worker: { condition: service_healthy }

  web:
    <<: *runtime
    build: { context: .., dockerfile: apps/web/Dockerfile }
    ports: ["5173:8080"]
    environment:
      REMOTE_AUTH_URL: http://127.0.0.1:5174/assets/remoteEntry.js
      REMOTE_ADMIN_USERS_URL: http://127.0.0.1:5175/assets/remoteEntry.js
      REMOTE_ADMIN_ROLES_URL: http://127.0.0.1:5176/assets/remoteEntry.js

  web-auth:
    <<: *runtime
    build: { context: .., dockerfile: apps/web-auth/Dockerfile }
    ports: ["5174:8080"]

  web-admin-users:
    <<: *runtime
    build: { context: .., dockerfile: apps/web-admin-users/Dockerfile }
    ports: ["5175:8080"]

  web-admin-roles:
    <<: *runtime
    build: { context: .., dockerfile: apps/web-admin-roles/Dockerfile }
    ports: ["5176:8080"]

volumes:
  pgdata:
