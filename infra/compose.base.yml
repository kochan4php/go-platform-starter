# Full local mesh (PLAN item 86): one command boots everything.
#   docker compose -f infra/compose.base.yml up --build
# Seeded admin: admin@example.local / admin-bootstrap-pw
# Shell: http://localhost:5173 · API docs: http://localhost:8000/docs
name: go-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  auth:
    build: { context: .., dockerfile: services/auth/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8081"
      APP_PUBLIC_URL: http://localhost:5173
      RBAC_INTERNAL_URL: http://rbac:8080
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  users:
    build: { context: .., dockerfile: services/users/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8082"
    ports: ["8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  rbac:
    build: { context: .., dockerfile: services/rbac/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8083"
    ports: ["8083:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8084"
      MAILER_DRIVER: console
    ports: ["8084:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  realtime:
    build: { context: .., dockerfile: services/realtime/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8085"
    ports: ["8085:8080"]
    depends_on:
      redis: { condition: service_healthy }

  # One-shot seeders (PLAN item 8 execution model, compose/dev flavor):
  # bootstrap admin credentials + role catalog. `docker compose up` runs them
  # once; re-run with `docker compose run --rm auth-seed`.
  auth-seed:
    build: { context: .., dockerfile: services/auth/Dockerfile }
    command: ["/service", "-seed"]
    env_file: [./go.env]
    environment:
      ADMIN_BOOTSTRAP_PASSWORD: admin-bootstrap-pw
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  rbac-seed:
    build: { context: .., dockerfile: services/rbac/Dockerfile }
    command: ["/service", "-seed"]
    env_file: [./go.env]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    build: { context: .., dockerfile: services/gateway/Dockerfile }
    env_file: [./go.env]
    environment:
      PORT: "8000"
      TRUSTED_DOMAINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
      UPSTREAMS: '{"auth":"http://auth:8080","users":"http://users:8080","rbac":"http://rbac:8080","worker":"http://worker:8080"}'
    ports: ["8000:8000"]
    depends_on:
      - auth
      - users
      - rbac
      - worker

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    ports: ["5173:80"]
    environment:
      REMOTE_AUTH_URL: http://localhost:5174/assets/remoteEntry.js
      REMOTE_ADMIN_USERS_URL: http://localhost:5175/assets/remoteEntry.js
      REMOTE_ADMIN_ROLES_URL: http://localhost:5176/assets/remoteEntry.js

  web-auth:
    build: { context: .., dockerfile: apps/web-auth/Dockerfile }
    ports: ["5174:80"]

  web-admin-users:
    build: { context: .., dockerfile: apps/web-admin-users/Dockerfile }
    ports: ["5175:80"]

  web-admin-roles:
    build: { context: .., dockerfile: apps/web-admin-roles/Dockerfile }
    ports: ["5176:80"]

volumes:
  pgdata:
