# Production stack (used by uat / demo / prod targets). One public entry
# (edge nginx, ports 80/443), everything else internal-only. Requires an env
# file:
#
#   docker compose --env-file .env.production -f compose.prod.yml up -d
#
# Migrations and seeds run via `compose run --rm <svc> -migrate|-seed`
# (deploy.sh does this before the rollout) — no long-lived job services.
#
# scripts/deploy.sh automates build -> migrate -> seed -> up -> health gates;
# STACK_ENV from the env file isolates container projects and state per env.

name: go-platform-${STACK_ENV:-prod}

x-service-defaults: &svc
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }

x-go-env: &go-env
  DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable
  REDIS_ADDR: redis:6379
  ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
  STREAM_SIGNING_KEYS: ${STREAM_SIGNING_KEYS:?set STREAM_SIGNING_KEYS}
  STREAM_ENCRYPTION_KEYS: ${STREAM_ENCRYPTION_KEYS:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-dev}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  BUILD_DATE: ${BUILD_DATE:-unknown}
  GOMEMLIMIT: ${GOMEMLIMIT:-200MiB}
  GOGC: ${GOGC:-100}
  DB_PREPARE_STMT: ${DB_PREPARE_STMT:-true}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-16}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-8}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
  DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
  DB_BOOT_RETRY_TIMEOUT: ${DB_BOOT_RETRY_TIMEOUT:-30s}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-15s}
  DB_IDLE_TX_TIMEOUT: ${DB_IDLE_TX_TIMEOUT:-30s}
  STREAM_MAXLEN: ${STREAM_MAXLEN:-100000}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1}
  SLOW_QUERY_SAMPLE_RATE: ${SLOW_QUERY_SAMPLE_RATE:-1}
  ACCESS_LOG_SAMPLE_RATE: ${ACCESS_LOG_SAMPLE_RATE:-0.1}
  DEBUG_REQUEST_TOKEN: ${DEBUG_REQUEST_TOKEN:-}

services:
  postgres:
    image: postgres:17-alpine
    <<: *svc
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/observability.sql:/docker-entrypoint-initdb.d/20-observability.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_interval: 1s

  redis:
    image: redis:7-alpine
    <<: *svc
    environment:
      REDIS_AUTH_PASSWORD: ${REDIS_AUTH_PASSWORD:?set REDIS_AUTH_PASSWORD}
      REDIS_USERS_PASSWORD: ${REDIS_USERS_PASSWORD:?set REDIS_USERS_PASSWORD}
      REDIS_RBAC_PASSWORD: ${REDIS_RBAC_PASSWORD:?set REDIS_RBAC_PASSWORD}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:?set REDIS_WORKER_PASSWORD}
      REDIS_SCHEDULER_PASSWORD: ${REDIS_SCHEDULER_PASSWORD:?set REDIS_SCHEDULER_PASSWORD}
      REDIS_REALTIME_PASSWORD: ${REDIS_REALTIME_PASSWORD:?set REDIS_REALTIME_PASSWORD}
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?set REDIS_GATEWAY_PASSWORD}
      REDIS_DLQ_ADMIN_PASSWORD: ${REDIS_DLQ_ADMIN_PASSWORD:?set REDIS_DLQ_ADMIN_PASSWORD}
      REDIS_BACKUP_PASSWORD: ${REDIS_BACKUP_PASSWORD:?set REDIS_BACKUP_PASSWORD}
      REDIS_OBSERVER_PASSWORD: ${REDIS_OBSERVER_PASSWORD:?set REDIS_OBSERVER_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s\n' \
          'user default off' \
          "user auth on >$$REDIS_AUTH_PASSWORD resetkeys resetchannels ~rl:* ~login:* ~auth:* ~mfa:* ~refresh:* ~reset:* ~scheduler:* ~users.events* ~mail.jobs* ~audit.events* ~webhook.jobs* &force-logout +get +set +getdel +del +incr +expire +pexpire +setnx +xadd +publish +eval +evalsha +time +ping" \
          "user users on >$$REDIS_USERS_PASSWORD resetkeys resetchannels ~users.events* ~audit.events* ~claims:* ~scheduler:* &force-logout +xreadgroup +xgroup +xack +xadd +get +set +setnx +del +pexpire +eval +evalsha +publish +ping" \
          "user rbac on >$$REDIS_RBAC_PASSWORD resetkeys resetchannels ~claims:* ~audit.events* ~users.events* &force-logout +get +set +xadd +xreadgroup +xgroup +xack +publish +ping" \
          "user worker on >$$REDIS_WORKER_PASSWORD resetkeys resetchannels ~mail.jobs* ~audit.events* ~webhook.jobs* ~*:dlq ~worker:* ~scheduler:* +xreadgroup +xgroup +xack +xautoclaim +xpending +xlen +xadd +get +set +setnx +del +pexpire +eval +evalsha +incr +expire +ping" \
          "user scheduler on >$$REDIS_SCHEDULER_PASSWORD resetkeys resetchannels ~leader:* ~scheduler:* ~*.events* ~*.jobs* +get +set +del +pexpire +eval +evalsha +xadd +ping" \
          "user realtime on >$$REDIS_REALTIME_PASSWORD resetkeys resetchannels &force-logout +subscribe +unsubscribe +psubscribe +punsubscribe +ping" \
          "user gateway on >$$REDIS_GATEWAY_PASSWORD resetkeys resetchannels ~rl:* ~claims:* +get +set +eval +evalsha +time +ping" \
          "user dlq-admin on >$$REDIS_DLQ_ADMIN_PASSWORD resetkeys resetchannels ~*:dlq +xrange +xread +xdel +xadd +ping" \
          "user backup on >$$REDIS_BACKUP_PASSWORD resetkeys resetchannels ~* +sync +psync +replconf +ping" \
          "user observer on >$$REDIS_OBSERVER_PASSWORD resetkeys resetchannels ~* +info +slowlog +latency +scan +dbsize +memory +ping" \
          > /data/users.acl
        exec redis-server --appendonly yes --aclfile /data/users.acl --io-threads 4 --io-threads-do-reads yes --lazyfree-lazy-eviction yes --lazyfree-lazy-expire yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user gateway --pass \"$$REDIS_GATEWAY_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 1s

  auth:
    build: { context: .., dockerfile: services/auth/Dockerfile }
    <<: *svc
    environment:
      <<: *go-env
      PORT: "8080"
      APP_PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      RBAC_INTERNAL_URL: http://rbac:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      PASSWORD_HASH_ALGORITHM: ${PASSWORD_HASH_ALGORITHM:-argon2id}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      HIBP_API_URL: https://api.pwnedpasswords.com/range
      SESSION_CRYPTO_KEYS: ${SESSION_CRYPTO_KEYS:?set SESSION_CRYPTO_KEYS}
      REDIS_USERNAME: auth
      REDIS_PASSWORD: ${REDIS_AUTH_PASSWORD:?set REDIS_AUTH_PASSWORD}
      SEED_HINT: "run via deploy script when SEED_ADMIN=true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  users:
    build: { context: .., dockerfile: services/users/Dockerfile }
    <<: *svc
    environment:
      <<: *go-env
      PORT: "8080"
      REDIS_USERNAME: users
      REDIS_PASSWORD: ${REDIS_USERS_PASSWORD:?set REDIS_USERS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  rbac:
    build: { context: .., dockerfile: services/rbac/Dockerfile }
    <<: *svc
    environment:
      <<: *go-env
      PORT: "8080"
      REDIS_USERNAME: rbac
      REDIS_PASSWORD: ${REDIS_RBAC_PASSWORD:?set REDIS_RBAC_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    <<: *svc
    environment:
      <<: *go-env
      PORT: "8080"
      MAILER_DRIVER: ${MAILER_DRIVER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      REDIS_USERNAME: worker
      REDIS_PASSWORD: ${REDIS_WORKER_PASSWORD:?set REDIS_WORKER_PASSWORD}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_XREAD_COUNT: ${WORKER_XREAD_COUNT:-100}
      WORKER_MIN_IDLE: ${WORKER_MIN_IDLE:-30s}
      DLQ_MAX_DEPTH: ${DLQ_MAX_DEPTH:-10000}
      MAIL_FALLBACK_HOST: ${MAIL_FALLBACK_HOST:-}
      MAIL_FALLBACK_PORT: ${MAIL_FALLBACK_PORT:-587}
      MAIL_FALLBACK_USER: ${MAIL_FALLBACK_USER:-}
      MAIL_FALLBACK_PASS: ${MAIL_FALLBACK_PASS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  realtime:
    build: { context: .., dockerfile: services/realtime/Dockerfile }
    <<: *svc
    environment:
      <<: *go-env
      PORT: "8080"
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL e.g. wss://domain/ws}
      REDIS_USERNAME: realtime
      REDIS_PASSWORD: ${REDIS_REALTIME_PASSWORD:?set REDIS_REALTIME_PASSWORD}
      WS_HEARTBEAT_INTERVAL: ${WS_HEARTBEAT_INTERVAL:-30s}
    depends_on:
      redis: { condition: service_healthy }

  scheduler:
    build: { context: .., dockerfile: services/scheduler/Dockerfile }
    <<: *svc
    environment:
      <<: *go-env
      PORT: "8080"
      REDIS_USERNAME: scheduler
      REDIS_PASSWORD: ${REDIS_SCHEDULER_PASSWORD:?set REDIS_SCHEDULER_PASSWORD}
      SCHEDULED_JOBS: ${SCHEDULED_JOBS:-[]}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    build: { context: .., dockerfile: services/gateway/Dockerfile }
    <<: *svc
    environment:
      <<: *go-env
      PORT: "8000"
      TRUSTED_DOMAINS: ${TRUSTED_DOMAINS:?set TRUSTED_DOMAINS}
      RATE_GLOBAL_PER_MINUTE: ${RATE_GLOBAL_PER_MINUTE:-300}
      # Gateway is internal-only here; nginx overwrites X-Forwarded-For.
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      UPSTREAMS: '{"auth":"http://auth:8080","users":"http://users:8080","rbac":"http://rbac:8080","worker":"http://worker:8080","realtime":"http://realtime:8080"}'
      REALTIME_UPSTREAM: http://realtime:8080
      REDIS_USERNAME: gateway
      REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?set REDIS_GATEWAY_PASSWORD}
    depends_on:
      auth: { condition: service_healthy }
      users: { condition: service_healthy }
      rbac: { condition: service_healthy }
      worker: { condition: service_healthy }
      realtime: { condition: service_healthy }

  # ---- web ------------------------------------------------------------------
  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    <<: *svc
    environment:
      NGINX_GZIP_LEVEL: ${NGINX_GZIP_LEVEL:-5}
      REMOTE_AUTH_URL: /remote/auth/assets/remoteEntry.js
      REMOTE_ADMIN_USERS_URL: /remote/admin-users/assets/remoteEntry.js
      REMOTE_ADMIN_ROLES_URL: /remote/admin-roles/assets/remoteEntry.js

  web-auth:
    build:
      context: ..
      dockerfile: apps/web-auth/Dockerfile
      args: { REMOTE_BASE: /remote/auth/ }
    <<: *svc
    environment:
      NGINX_GZIP_LEVEL: ${NGINX_GZIP_LEVEL:-5}

  web-admin-users:
    build:
      context: ..
      dockerfile: apps/web-admin-users/Dockerfile
      args: { REMOTE_BASE: /remote/admin-users/ }
    <<: *svc
    environment:
      NGINX_GZIP_LEVEL: ${NGINX_GZIP_LEVEL:-5}

  web-admin-roles:
    build:
      context: ..
      dockerfile: apps/web-admin-roles/Dockerfile
      args: { REMOTE_BASE: /remote/admin-roles/ }
    <<: *svc
    environment:
      NGINX_GZIP_LEVEL: ${NGINX_GZIP_LEVEL:-5}

  # ---- single public entry ---------------------------------------------------
  edge:
    image: nginxinc/nginx-unprivileged:alpine
    <<: *svc
    ports:
      - "80:8080"
      # TLS: drop a rendered edge-ssl.conf into infra/nginx/conf.d (template in
      # edge.tls.conf.template) and publish 443 below.
      # - "443:8443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }
      web-auth: { condition: service_healthy }
      web-admin-users: { condition: service_healthy }
      web-admin-roles: { condition: service_healthy }

  postgres-backup:
    image: postgres:17-alpine
    <<: *svc
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command: ["while true; do /scripts/backup.sh; sleep $${BACKUP_INTERVAL_SECONDS:-86400}; done"]
    depends_on:
      postgres: { condition: service_healthy }

  redis-backup:
    image: redis:7-alpine
    <<: *svc
    environment:
      REDISCLI_AUTH: ${REDIS_BACKUP_PASSWORD:?set REDIS_BACKUP_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - while true; do redis-cli -h redis --user backup --rdb "/backups/redis-$$(date -u +%Y%m%dT%H%M%SZ).rdb"; find /backups -name 'redis-*.rdb' -mtime +$${BACKUP_RETENTION_DAYS} -delete; sleep $${BACKUP_INTERVAL_SECONDS:-86400}; done
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
  backups:
