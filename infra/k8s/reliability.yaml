apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-gateway
value: 100000
globalDefault: false
description: Keep the public gateway schedulable during node pressure.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-services
spec:
  maxUnavailable: 1
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, users, rbac, worker, gateway]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-web
spec:
  maxUnavailable: 1
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [web, web-auth, web-admin-users, web-admin-roles]
