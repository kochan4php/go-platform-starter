apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
replicas:
  - count: 1
    name: auth
  - count: 1
    name: users
  - count: 1
    name: rbac
  - count: 1
    name: worker
  - count: 1
    name: realtime
  - count: 1
    name: scheduler
  - count: 1
    name: gateway
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
