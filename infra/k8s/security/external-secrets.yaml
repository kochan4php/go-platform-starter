apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: platform
          serviceAccountRef:
            name: external-secrets
            namespace: platform
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: platform-secrets, kind: ClusterSecretStore }
  target: { name: users, creationPolicy: Owner }
  dataFrom:
    - extract: { key: users }
---
