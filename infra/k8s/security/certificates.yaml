apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: letsencrypt-production }
spec:
  acme:
    email: platform-ops@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-production-account }
    solvers:
      - http01:
          ingress: { ingressClassName: nginx }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: platform-edge, namespace: platform }
spec:
  secretName: platform-edge-tls
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
  dnsNames: [platform.example.com]
  privateKey:
    rotationPolicy: Always
  renewBefore: 720h
