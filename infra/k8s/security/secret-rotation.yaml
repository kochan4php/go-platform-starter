apiVersion: batch/v1
kind: CronJob
metadata: { name: platform-secret-rotation, namespace: platform }
spec:
  schedule: "0 3 1 * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: secret-rotator
          restartPolicy: OnFailure
          containers:
            - name: rotate
              image: hashicorp/vault:1.20
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  ring="$(vault kv get -field=ACCESS_TOKEN_SECRET platform/runtime-signing)"
                  old="${ring%%,*}"
                  new="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
                  kid="$(date -u +%Y%m%d)"
                  vault kv patch platform/runtime-signing ACCESS_TOKEN_SECRET="$kid:$new,$old"
              env:
                - { name: VAULT_ADDR, value: "https://vault.example.com" }
                - name: VAULT_TOKEN
                  valueFrom: { secretKeyRef: { name: vault-rotator-token, key: token } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
