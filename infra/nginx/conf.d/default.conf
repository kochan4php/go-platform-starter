# Production edge (single public entry). Same-origin for the shell, the
# remotes, and the API — no CORS surface, cookies just work.
#
#   /                     -> apps/web (federation host)
#   /remote/<name>/...    -> remote static servers (prefix stripped)
#   /api/..., /docs, /ws  -> gateway (ws upgrades passthrough)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Realtime websocket (gateway -> realtime)
    location = /ws {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Gateway: REST + docs + probes
    location ~ ^/(api|docs|healthz|readyz|metrics)(/|$) {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Federated remotes (trailing slash strips the /remote/<name> prefix)
    location /remote/auth/ {
        proxy_pass http://web-auth/;
        proxy_set_header Host $host;
    }
    location /remote/admin-users/ {
        proxy_pass http://web-admin-users/;
        proxy_set_header Host $host;
    }
    location /remote/admin-roles/ {
        proxy_pass http://web-admin-roles/;
        proxy_set_header Host $host;
    }

    # Federation host shell (SPA fallback lives inside its own nginx too,
    # but keep it at the edge so deep links never leak to a 404 page).
    location / {
        proxy_pass http://web/;
        proxy_set_header Host $host;
    }
}
