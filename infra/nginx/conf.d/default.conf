# Production edge (single public entry). Same-origin for the shell, the
# remotes, and the API — no CORS surface, cookies just work.
#
#   /                     -> apps/web (federation host)
#   /remote/<name>/...    -> remote static servers (prefix stripped)
#   /api/..., /docs, /ws  -> gateway (ws upgrades passthrough)
#
# IMPORTANT: upstream names are used through VARIABLES + the Docker embedded
# resolver (127.0.0.11). nginx otherwise resolves a hostname once at startup
# and caches it forever — recreated containers get new IPs and every request
# starts returning 502 until the edge is restarted. With variables, resolution
# happens per-request honoring the short TTL below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:" always;

    # Realtime websocket (gateway -> realtime)
    location = /ws {
        set $ws_up http://gateway:8000;
        proxy_pass $ws_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Gateway: REST + docs + probes
    location ~ ^/(api|docs|healthz|readyz|metrics)(/|$) {
        set $gw_up http://gateway:8000;
        proxy_pass $gw_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Federated remotes (rewrite strips the /remote/<name> prefix)
    location /remote/auth/ {
        set $auth_up http://web-auth:8080;
        rewrite ^/remote/auth/(.*)$ /$1 break;
        proxy_pass $auth_up;
        proxy_set_header Host $host;
    }
    location /remote/admin-users/ {
        set $users_up http://web-admin-users:8080;
        rewrite ^/remote/admin-users/(.*)$ /$1 break;
        proxy_pass $users_up;
        proxy_set_header Host $host;
    }
    location /remote/admin-roles/ {
        set $roles_up http://web-admin-roles:8080;
        rewrite ^/remote/admin-roles/(.*)$ /$1 break;
        proxy_pass $roles_up;
        proxy_set_header Host $host;
    }

    # Federation host shell (its own nginx serves index.html for SPA routes)
    location / {
        set $shell_up http://web:8080;
        proxy_pass $shell_up;
        proxy_set_header Host $host;
    }
}
