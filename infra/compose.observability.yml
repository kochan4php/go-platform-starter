# Observability stack (PLAN items 72–73). Run on top of the base mesh:
#   docker compose -f infra/compose.base.yml up -d
#   docker compose -f infra/compose.observability.yml --profile obs up
x-observability: &observability
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }

services:
  auth:
    environment: &pprof-env
      PPROF_ADDR: 0.0.0.0:6060
      PPROF_ALLOW_NETWORK: "true"

  users:
    environment: *pprof-env

  rbac:
    environment: *pprof-env

  worker:
    environment: *pprof-env

  realtime:
    environment: *pprof-env

  gateway:
    environment: *pprof-env

  otel-collector:
    <<: *observability
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/config.yaml:ro
    ports: ["4318:4318"]

  prometheus:
    <<: *observability
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  postgres-exporter:
    <<: *observability
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@postgres:5432/app?sslmode=disable
    depends_on:
      - postgres

  grafana:
    <<: *observability
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  pyroscope:
    <<: *observability
    image: grafana/pyroscope:latest
    command: ["server"]
    ports: ["4040:4040"]

  alloy:
    <<: *observability
    image: grafana/alloy:latest
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - pyroscope
      - auth
      - users
      - rbac
      - worker
      - realtime
      - gateway

  node-exporter:
    <<: *observability
    image: prom/node-exporter:latest
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]

  blackbox-exporter:
    <<: *observability
    image: prom/blackbox-exporter:latest
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
