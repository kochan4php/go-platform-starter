modules:
  https_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      follow_redirects: true
      preferred_ip_protocol: ip4
  login_http_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
      headers: { Content-Type: application/json, X-Device-ID: synthetic-monitor }
      body: '{"email":"admin@example.local","password":"local-root-access-2026!"}'
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      query_name: example.com
      query_type: A
      valid_rcodes: [NOERROR]
