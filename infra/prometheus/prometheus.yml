global:
  scrape_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: platform-services
    static_configs:
      - targets:
          - gateway:8000
          - auth:8081
          - users:8082
          - rbac:8083
          - worker:8084
          - realtime:8085
        labels:
          mesh: local

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: certificate
    metrics_path: /probe
    params: { module: [https_2xx] }
    static_configs:
      # Replace with the deployment's public health URL.
      - targets: ["https://example.com/healthz"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }
