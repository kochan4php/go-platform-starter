# LAB nginx for the shell container: serves the built shell AND proxies /api
# (+ /ws) to the gateway, so the same-origin GATEWAY_URL fallback works with
# pre-runtime-config images. Runtime config.js (infra/lab/web.config.js)
# points newer bundles straight at :8000 — both paths coexist happily.
# Only a websocket upgrade is forwarded; anything else (h2c) is dropped.
map $http_upgrade $safe_upgrade {
    websocket $http_upgrade;
    default   "";
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Gateway may come up after this container; resolve per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /ws {
        set $gw http://gateway:8000;
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal -- the upstream is a literal set above (the variable only defers DNS resolution), and these locations must stay externally reachable; "internal" would make the whole route unroutable.
        proxy_pass $gw;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- $safe_upgrade forwards only the websocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $safe_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $gw2 http://gateway:8000;
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal -- the upstream is a literal set above (the variable only defers DNS resolution), and these locations must stay externally reachable; "internal" would make the whole route unroutable.
        proxy_pass $gw2;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- $safe_upgrade forwards only the websocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	location /telemetry/ {
		set $gw3 http://gateway:8000;
		# nosemgrep: generic.nginx.security.missing-internal.missing-internal -- the upstream is a literal set above (the variable only defers DNS resolution), and these locations must stay externally reachable; "internal" would make the whole route unroutable.
		proxy_pass $gw3;
		# nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- $safe_upgrade forwards only the websocket upgrade
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

    location / {
        try_files $uri /index.html;
    }
}
