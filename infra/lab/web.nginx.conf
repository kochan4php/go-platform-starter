# LAB nginx for the shell container: serves the built shell AND proxies /api
# (+ /ws) to the gateway, so the same-origin GATEWAY_URL fallback works with
# pre-runtime-config images. Runtime config.js (infra/lab/web.config.js)
# points newer bundles straight at :8000 — both paths coexist happily.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Gateway may come up after this container; resolve per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;

    location = /ws {
        set $gw http://gateway:8000;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $gw2 http://gateway:8000;
        proxy_pass $gw2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
