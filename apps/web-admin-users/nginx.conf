server {
    # Lab/dev imports these assets cross-origin; required for ES modules.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://127.0.0.1:8010" always;
    listen 8080;
    root /usr/share/nginx/html;
	sendfile on;
	tcp_nopush on;
	open_file_cache max=1000 inactive=60s;
	open_file_cache_valid 120s;
	gzip on;
	gzip_comp_level ${NGINX_GZIP_LEVEL};
	gzip_types text/css application/javascript application/json image/svg+xml;

    # RemoteEntry + assets only; no SPA routing needed.
    location /assets/ {
        # Repeated: a location-level add_header suppresses server-level ones.
        add_header Access-Control-Allow-Origin "*" always;
		add_header Cache-Control "public, max-age=31536000, immutable, stale-while-revalidate=86400" always;
    }
}
