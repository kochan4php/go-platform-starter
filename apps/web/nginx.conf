server {
    # Lab/dev imports these assets cross-origin; required for ES modules.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' http://127.0.0.1:5174 http://127.0.0.1:5175 http://127.0.0.1:5176; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://127.0.0.1:8010 ws://127.0.0.1:8000 ws://127.0.0.1:8010" always;
    listen 8080;
    root /usr/share/nginx/html;

    # SPA fallback: the shell owns client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
