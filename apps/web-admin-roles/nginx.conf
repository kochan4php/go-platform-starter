server {
    # Lab/dev imports these assets cross-origin; required for ES modules.
    add_header Access-Control-Allow-Origin "*" always;
    listen 80;
    root /usr/share/nginx/html;

    # RemoteEntry + assets only; no SPA routing needed.
    location /assets/ {
        # Repeated: a location-level add_header suppresses server-level ones.
        add_header Access-Control-Allow-Origin "*" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
