# Copy to a real Secret (or render via your secrets tooling) — placeholders only.
apiVersion: v1
kind: Secret
metadata:
  name: gateway
type: Opaque
stringData:
  PORT: "8080"
  LOG_LEVEL: info
  DATABASE_URL: postgres://USER:PASS@HOST:5432/DB?sslmode=disable
  REDIS_ADDR: redis:6379
  ACCESS_TOKEN_SECRET: change-me-min-16-chars
  INTERNAL_SECRET: change-me-internal-secret
  TRUSTED_DOMAINS: https://app.example.com
  UPSTREAMS: '{"auth":"http://auth","users":"http://users","rbac":"http://rbac","worker":"http://worker"}'
