root = "."
tmp_dir = "tmp/air/gateway"

[build]
cmd = "go build -o ./tmp/air/gateway/app ./services/gateway"
bin = "./tmp/air/gateway/app"
full_bin = "APP_ENV_FILE=services/gateway/.env ./tmp/air/gateway/app"
include_ext = ["go", "sql", "yaml", "yml", "env"]
exclude_dir = [".git", "graphify-out", "node_modules", "tmp"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true
