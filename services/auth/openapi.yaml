openapi: 3.0.3
info:
  title: auth service API
  version: 0.1.0
  description: |
    Register/login/refresh(rotation+reuse-detect)/forgot/reset, session management.
    Mounted by the gateway under /api/v1/auth.

paths:
  /auth/register:
    post:
      operationId: register
      summary: create credentials; emits user.created onto users.events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          email: { type: string }
        "409":
          description: email already registered (documented enumeration trade — see PLAN risks)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeFail" }
      x-rate-limit-class: strict

  /auth/login:
    post:
      operationId: login
      summary: uniform-401 login with lockout; mints access token + sets refresh cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: logged in
          headers:
            Set-Cookie:
              description: refresh_token httpOnly cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user:
                            type: object
                            properties:
                              id: { type: string }
                              email: { type: string }
        "401":
          description: unknown/wrong/locked are indistinguishable (incl. timing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeFail" }
      x-rate-limit-class: strict

  /auth/refresh:
    post:
      operationId: refresh
      summary: rotate the refresh cookie (reuse kills the family) and mint a new access token
      responses:
        "200":
          description: rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
        "401": { description: missing/invalid/replayed refresh token, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
      x-rate-limit-class: strict

  /auth/logout:
    post:
      operationId: logout
      summary: revoke the session carried by the refresh cookie and clear it
      responses:
        "200": { description: logged out, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/sessions:
    get:
      operationId: listSessions
      summary: active sessions of the authenticated user
      security: [{ bearerAuth: [] }]
      x-auth: required
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Session" }
                          meta: { $ref: "#/components/schemas/EnvelopeMeta" }
    delete:
      operationId: revokeAllSessions
      summary: revoke every other session of the authenticated user
      security: [{ bearerAuth: [] }]
      x-auth: required
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: revoke one session of the authenticated user
      security: [{ bearerAuth: [] }]
      x-auth: required
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: revoked, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: unknown session, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/forgot:
    post:
      operationId: forgotPassword
      summary: always-200 password reset request (anti-enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotInput"
      responses:
        "200": { description: uniform response, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
      x-rate-limit-class: strict

  /auth/reset:
    post:
      operationId: resetPassword
      summary: consume a single-use reset token, set new password, wipe all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200": { description: password updated, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "400": { description: invalid/expired/consumed token or weak password, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
      x-rate-limit-class: strict

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    EnvelopeMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }

    EnvelopeOK:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { description: endpoint-specific payload }

    EnvelopeFail:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean }
        message: { type: string }
        error: { type: string }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string }
        ip: { type: string }
        createdAt: { type: string, format: date-time }
        current: { type: boolean }

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    ForgotInput:
      type: object
      required: [email]
      properties:
        email: { type: string }

    ResetInput:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 72 }
