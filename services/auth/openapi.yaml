openapi: 3.0.3
info:
  title: auth service API
  version: 0.1.0
  description: |
    Register/login/refresh(rotation+reuse-detect)/forgot/reset, session management.
    Mounted by the gateway under /api/v1/auth.

paths:
  /auth/register:
    post:
      x-request-body-limit: 16384
      operationId: register
      summary: create credentials; emits user.created onto users.events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
                          email: { type: string, maxLength: 254 }
        "409":
          description: email already registered (documented enumeration trade — see PLAN risks)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeFail" }
      x-rate-limit-class: strict

  /auth/login:
    post:
      x-request-body-limit: 16384
      operationId: login
      summary: uniform-401 login with lockout; mints access token + sets refresh cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: logged in
          headers:
            Set-Cookie:
              description: refresh_token httpOnly cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string, maxLength: 4096 }
                          user:
                            type: object
                            properties:
                              id: { type: integer, format: int64 }
                              email: { type: string, maxLength: 254 }
        "401":
          description: unknown/wrong/locked are indistinguishable (incl. timing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeFail" }
      x-rate-limit-class: strict

  /auth/refresh:
    post:
      operationId: refresh
      summary: rotate the refresh cookie (reuse kills the family) and mint a new access token
      responses:
        "200":
          description: rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string, maxLength: 4096 }
        "401": { description: missing/invalid/replayed refresh token, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
      x-rate-limit-class: strict

  /auth/logout:
    post:
      operationId: logout
      summary: revoke the session carried by the refresh cookie and clear it
      responses:
        "200": { description: logged out, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/mfa/enroll:
    post:
      operationId: beginMFA
      summary: create a time-limited TOTP enrollment and QR code
      security: [{ bearerAuth: [] }]
      x-auth: required
      responses:
        "200": { description: enrollment started, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/mfa/verify:
    post:
      x-request-body-limit: 4096
      operationId: verifyMFA
      summary: verify TOTP and enable MFA for the authenticated user
      security: [{ bearerAuth: [] }]
      x-auth: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$", maxLength: 6 }
      responses:
        "200": { description: MFA enabled, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      summary: replace and return ten single-use MFA recovery codes exactly once
      security: [{ bearerAuth: [] }]
      x-auth: required
      x-rate-limit-class: strict
      responses:
        "200": { description: recovery codes, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/login-history:
    get:
      operationId: loginHistory
      summary: the authenticated user's privacy-bounded login history and risk scores
      security: [{ bearerAuth: [] }]
      x-auth: required
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200": { description: login history, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/impersonate/{id}:
    post:
      operationId: impersonateUser
      summary: mint a read-only 15-minute audited support token for a managed user
      x-required-permission: "user:read:any"
      x-rate-limit-class: strict
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      responses:
        "200": { description: short-lived read-only access token, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: target missing, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/magic-link:
    post:
      operationId: requestMagicLink
      summary: always queue a single-use passwordless login link when the account exists
      x-rate-limit-class: strict
      x-request-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotInput" }
      responses:
        "202": { description: uniform anti-enumeration response, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/magic-link/consume:
    post:
      operationId: consumeMagicLink
      summary: consume a passwordless login token and create a normal rotating session
      x-rate-limit-class: strict
      x-request-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetTokenInput" }
      responses:
        "200": { description: logged in, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "400": { description: "invalid, expired, or consumed token", content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      summary: create a short-lived OAuth state and return the provider authorization URL
      x-rate-limit-class: strict
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
      responses:
        "200": { description: authorization URL, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "503": { description: provider not configured, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/oauth/{provider}/callback:
    get:
      operationId: finishOAuth
      summary: validate OAuth state, exchange the code, and create or link the user session
      x-rate-limit-class: strict
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
        - { name: code, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 2048 } }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 20, maxLength: 512 } }
      responses:
        "303": { description: session cookie set and browser redirected to the product console }
        "400": { description: invalid state or provider response, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/sessions:
    get:
      operationId: listSessions
      summary: active sessions of the authenticated user
      security: [{ bearerAuth: [] }]
      x-auth: required
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Session" }
                          meta: { $ref: "#/components/schemas/EnvelopeMeta" }
    delete:
      operationId: revokeAllSessions
      summary: revoke every other session of the authenticated user
      security: [{ bearerAuth: [] }]
      x-auth: required
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: revoke one session of the authenticated user
      security: [{ bearerAuth: [] }]
      x-auth: required
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: revoked, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: unknown session, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/forgot:
    post:
      x-request-body-limit: 4096
      operationId: forgotPassword
      summary: always-200 password reset request (anti-enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotInput"
      responses:
        "200": { description: uniform response, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
      x-rate-limit-class: strict

  /auth/reset:
    post:
      x-request-body-limit: 16384
      operationId: resetPassword
      summary: consume a single-use reset token, set new password, wipe all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200": { description: password updated, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "400": { description: invalid/expired/consumed token or weak password, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
      x-rate-limit-class: strict

  /auth/reset/validate:
    post:
      x-request-body-limit: 4096
      operationId: validateResetToken
      summary: validate a reset token without consuming its single-use grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetTokenInput"
      responses:
        "200": { description: token valid, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "400": { description: "invalid, expired, or consumed token", content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
      x-rate-limit-class: strict

  /auth/users/{id}/password:
    post:
      x-request-body-limit: 16384
      operationId: adminSetUserPassword
      summary: admin sets a new password for a user (revokes their sessions)
      x-required-permission: "user:update:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 12, maxLength: 72 }
      responses:
        "200": { description: password updated, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: user not found, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/confirm-password:
    post:
      x-request-body-limit: 4096
      operationId: confirmPassword
      summary: re-authenticate the current user before a sensitive admin action
      security: [{ bearerAuth: [] }]
      x-auth: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 72 }
      responses:
        "200": { description: confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "401": { description: invalid password, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/password:
    post:
      operationId: changePassword
      summary: change the authenticated user's password after verifying the old password
      security: [{ bearerAuth: [] }]
      x-auth: required
      x-rate-limit-class: strict
      x-request-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, minLength: 1, maxLength: 72 }
                newPassword: { type: string, minLength: 12, maxLength: 72 }
      responses:
        "200": { description: changed and all sessions revoked, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "401": { description: old password invalid, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/users/{id}/sessions:
    get:
      operationId: adminListUserSessions
      summary: list active sessions for a managed user
      x-required-permission: "user:read:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
    delete:
      operationId: adminRevokeUserSessions
      summary: force logout a managed user on every device
      x-required-permission: "user:update:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: revoked, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /auth/users/{id}/sessions/{sessionId}:
    delete:
      operationId: adminRevokeUserSession
      summary: revoke one active session for a managed user
      x-required-permission: "user:update:any"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: revoked, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: unknown session, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /auth/users/{id}/state:
    patch:
      x-request-body-limit: 4096
      operationId: adminSetUserState
      summary: activate/deactivate and lock/unlock a managed user
      x-required-permission: "user:update:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, inactive] }
                locked: { type: boolean }
      responses:
        "200": { description: updated, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: user not found, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    EnvelopeMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }

    EnvelopeOK:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean }
        message: { type: string, maxLength: 255 }
        data: { description: endpoint-specific payload }

    EnvelopeFail:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean }
        message: { type: string, maxLength: 255 }
        error: { type: string, maxLength: 120 }

    Session:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userAgent: { type: string, maxLength: 512 }
        ip: { type: string, maxLength: 64 }
        deviceId: { type: string, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        current: { type: boolean }

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 72 }
        displayName: { type: string, maxLength: 120 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 72 }
        otp: { type: string, minLength: 6, maxLength: 64, description: six-digit TOTP or a single-use recovery code }

    ForgotInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    ResetInput:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, maxLength: 4096 }
        newPassword: { type: string, minLength: 12, maxLength: 72 }

    ResetTokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 4096 }
