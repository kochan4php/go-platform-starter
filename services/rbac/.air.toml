root = "."
tmp_dir = "tmp/air/rbac"

[build]
cmd = "go build -o ./tmp/air/rbac/app ./services/rbac"
bin = "./tmp/air/rbac/app"
full_bin = "APP_ENV_FILE=services/rbac/.env ./tmp/air/rbac/app"
include_ext = ["go", "sql", "yaml", "yml", "env"]
exclude_dir = [".git", "graphify-out", "node_modules", "tmp"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true
