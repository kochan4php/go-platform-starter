# Runs golang-migrate before every rollout (PLAN item 8). The deployment's
# readyz verifies the applied version instead of migrating on boot, so
# scale-out events never race migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: users-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: users-migrate
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          image: ghcr.io/kochan4php/users:latest-migrate
          envFrom:
            - secretRef:
                name: users
          env:
            - name: MIGRATIONS_DIR
              value: /migrations
