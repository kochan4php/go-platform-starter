openapi: 3.0.3
info:
  title: users service API
  version: 0.1.0
  description: |
    Profile CRUD keyed by `sub` (data-split contract: credentials live in auth).
    "Create" provisions a profile for an existing subject; lifecycle events from
    auth materialize/delete rows automatically. Mounted under /api/v1/users.

paths:
  /users/me:
    get:
      operationId: me
      summary: the caller's profile, served purely from identity headers
      x-auth: required
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "401": { description: no identity, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
    delete:
      operationId: eraseMe
      summary: irreversibly erase the caller's personal data and revoke access
      x-auth: required
      responses:
        "200": { description: erased, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/me/export:
    get:
      operationId: exportMyData
      summary: download all personal data held by the platform
      x-auth: required
      responses:
        "200":
          description: JSON data export
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOK" }

  /users:
    post:
      x-request-body-limit: 16384
      operationId: createUserProfile
      summary: provision a profile row for an existing sub
      x-required-permission: "user:create:any"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "409": { description: profile already exists, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

    get:
      operationId: listUsers
      summary: paginated profiles with validated server-side sorting
      x-required-permission: "user:read:any"
      parameters:
        - { name: limit, in: query, schema: { type: integer, enum: [10, 20, 50], default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cursor, in: query, description: opaque keyset cursor for createdAt sorting, schema: { type: string, maxLength: 200 } }
        - { name: ids, in: query, description: comma-separated batch of at most 100 user IDs, schema: { type: string, maxLength: 2200 } }
        - { name: fields, in: query, description: comma-separated sparse fields, schema: { type: string, maxLength: 300 } }
        - { name: count, in: query, description: total-count strategy, schema: { type: string, enum: [exact, estimate, none], default: exact } }
        - { name: q, in: query, description: case-insensitive email/display-name search, schema: { type: string, maxLength: 120 } }
        - { name: presence, in: query, schema: { type: string, enum: [online, offline] } }
        - { name: roleId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: registeredFrom, in: query, schema: { type: string, format: date-time } }
        - { name: registeredTo, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, displayName, email, lastLoginAt], default: createdAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Profile" }
                          meta: { $ref: "#/components/schemas/EnvelopeMeta" }

  /users/stats:
    get:
      operationId: getUserStats
      summary: directory totals and seven-day registration series
      x-required-permission: "user:read:any"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserStats" }

  /users/{id}:
    get:
      operationId: getUser
      x-required-permission: "user:read:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "404": { description: unknown, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

    patch:
      x-request-body-limit: 16384
      operationId: updateUser
      x-auth: required
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "404": { description: unknown, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

    delete:
      operationId: deleteUser
      summary: soft-delete the profile row and emit user.deleted
      x-required-permission: "user:delete:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: deleted, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: unknown, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

components:
  schemas:
    EnvelopeMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }

    EnvelopeOK:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean }
        message: { type: string, maxLength: 255 }
        data: {}

    EnvelopeFail:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean }
        message: { type: string, maxLength: 255 }
        error: { type: string, maxLength: 120 }

    Profile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 120 }
        avatarUrl: { type: string, format: uri, maxLength: 400, pattern: "^https://" }
        status: { type: string, enum: [active, inactive, deleted] }
        lockedUntil: { type: string, format: date-time, nullable: true }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleSummary" }
        online: { type: boolean }
        activeSessions: { type: integer }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        lastLoginIp: { type: string, maxLength: 45 }
        lastLoginUserAgent: { type: string, maxLength: 512 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RoleSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }

    UserStats:
      type: object
      required: [total, online, registrations]
      properties:
        total: { type: integer, format: int64 }
        online: { type: integer, format: int64 }
        registrations:
          type: array
          items:
            type: object
            required: [day, count]
            properties:
              day: { type: string, format: date }
              count: { type: integer, format: int64 }

    ProfileInput:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64, description: existing subject id }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 120 }
        avatarUrl: { type: string, format: uri, maxLength: 400, pattern: "^https://" }
