openapi: 3.0.3
info:
  title: users service API
  version: 0.1.0
  description: |
    Profile CRUD keyed by `sub` (data-split contract: credentials live in auth).
    "Create" provisions a profile for an existing subject; lifecycle events from
    auth materialize/delete rows automatically. Mounted under /api/v1/users.

paths:
  /users/avatar/resize:
    post:
      operationId: resizeAvatar
      summary: validate and resize an avatar to fit within 512x512
      x-auth: required
      x-request-body-limit: 8388608
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: resized JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }

  /users/me:
    get:
      operationId: me
      summary: the caller's profile, served purely from identity headers
      x-auth: required
      parameters:
        - { name: include, in: query, description: related data; roles and permissions are included by default, schema: { type: string, enum: [roles, permissions, "roles,permissions"], default: "roles,permissions" } }
      responses:
        "200":
          description: ok
          headers:
            ETag: { description: weak profile validator, schema: { type: string } }
            Cache-Control: { description: private 30-second cache policy, schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "401": { description: no identity, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
    delete:
      operationId: eraseMe
      summary: irreversibly erase the caller's personal data and revoke access
      x-auth: required
      responses:
        "200": { description: erased, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/me/export:
    get:
      operationId: exportMyData
      summary: download all personal data held by the platform
      x-auth: required
      responses:
        "200":
          description: JSON data export
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOK" }

  /users:
    post:
      x-request-body-limit: 16384
      operationId: createUserProfile
      summary: provision a profile row for an existing sub
      x-required-permission: "user:create:any"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "409": { description: profile already exists, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

    get:
      operationId: listUsers
      summary: paginated profiles with validated server-side sorting
      x-required-permission: "user:read:any"
      parameters:
        - { name: limit, in: query, schema: { type: integer, enum: [10, 20, 50], default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cursor, in: query, description: opaque keyset cursor for createdAt sorting, schema: { type: string, maxLength: 200 } }
        - { name: ids, in: query, description: comma-separated batch of at most 100 user IDs, schema: { type: string, maxLength: 2200 } }
        - { name: fields, in: query, description: comma-separated sparse fields, schema: { type: string, maxLength: 300 } }
        - { name: include, in: query, description: comma-separated related data, schema: { type: string, enum: [roles, permissions, "roles,permissions"], default: "roles,permissions" } }
        - { name: count, in: query, description: total-count strategy, schema: { type: string, enum: [exact, estimate, none], default: exact } }
        - { name: q, in: query, description: case-insensitive email/display-name search, schema: { type: string, maxLength: 120 } }
        - { name: presence, in: query, schema: { type: string, enum: [online, offline] } }
        - { name: roleId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: registeredFrom, in: query, schema: { type: string, format: date-time } }
        - { name: registeredTo, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, displayName, email, lastLoginAt], default: createdAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Profile" }
                          meta: { $ref: "#/components/schemas/EnvelopeMeta" }

  /users/stats:
    get:
      operationId: getUserStats
      summary: directory totals and seven-day registration series
      x-required-permission: "user:read:any"
      x-cache-ttl: 15s
      x-consumer-quota-per-minute: 120
      x-request-headers:
        X-Read-Model: dashboard
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserStats" }

  /users/product/overview:
    get:
      operationId: productOverview
      summary: aggregate product dashboard counters and registration series
      x-required-permission: "user:read:any"
      x-cache-ttl: 15s
      responses:
        "200": { description: product overview, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/product/records:
    get:
      operationId: listProductRecords
      summary: list typed product workflows visible to the caller
      x-auth: required
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ProductKind" } }
        - { name: status, in: query, schema: { type: string, maxLength: 40 } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: visible records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/ProductRecord" }
                          meta: { $ref: "#/components/schemas/EnvelopeMeta" }
    post:
      operationId: createProductRecord
      summary: create a notification, workflow, integration, preference, or report schedule
      x-auth: required
      x-idempotency-key: supported
      x-request-body-limit: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRecordInput" }
      responses:
        "201": { description: created; secret is returned once for token-bearing records, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/product/records/{id}:
    patch:
      operationId: updateProductRecord
      summary: update product workflow status and payload
      x-auth: required
      x-request-body-limit: 65536
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRecordUpdate" }
      responses:
        "200": { description: updated, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: unknown or inaccessible record, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }
    delete:
      operationId: deleteProductRecord
      summary: delete a caller-owned or administratively managed product record
      x-auth: required
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      responses:
        "200": { description: deleted, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/product/search:
    get:
      operationId: searchProduct
      summary: global search across profiles and accessible product resources
      x-auth: required
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        "200": { description: ranked search results, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/product/analytics:
    get:
      operationId: productAnalytics
      summary: activity heatmap, role usage, login risk, and usage metering
      x-required-permission: "user:read:any"
      responses:
        "200": { description: analytics snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/product/permissions/simulate:
    post:
      operationId: simulatePermission
      summary: explain whether roles or a live delegation grant a permission
      x-required-permission: "role:read:any"
      x-request-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, permission]
              properties:
                userId: { type: integer, format: int64, minimum: 1 }
                permission: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { description: decision and grant sources, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/product/presence:
    get:
      operationId: productPresence
      summary: privacy-safe public presence aggregate for authenticated clients
      x-auth: required
      x-cache-ttl: 10s
      responses:
        "200": { description: aggregate online and total counts, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/product/invitations/verify:
    post:
      operationId: verifyInvitation
      summary: consume an invitation and return its pre-approved registration attributes
      x-rate-limit-class: strict
      x-request-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "200": { description: invitation accepted, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "400": { description: invalid or expired invitation, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

  /users/me/email-change:
    post:
      operationId: requestEmailChange
      summary: send a single-use verification link before changing the caller email
      x-auth: required
      x-rate-limit-class: strict
      x-request-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202": { description: verification queued, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/email-change/verify:
    post:
      operationId: verifyEmailChange
      summary: consume an email-change token and atomically replace the identity email
      x-rate-limit-class: strict
      x-request-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "200": { description: email changed, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/me/deletion:
    post:
      operationId: requestAccountDeletion
      summary: schedule account erasure after a 30-day grace period and revoke sessions
      x-auth: required
      x-rate-limit-class: strict
      responses:
        "202": { description: deletion scheduled and restoration link queued, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/deletion/restore:
    post:
      operationId: restoreAccountDeletion
      summary: restore an account during its 30-day deletion grace period
      x-rate-limit-class: strict
      x-request-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "200": { description: account restored, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }

  /users/{id}:
    get:
      operationId: getUser
      x-required-permission: "user:read:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "404": { description: unknown, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

    patch:
      x-request-body-limit: 16384
      operationId: updateUser
      x-auth: required
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeOK"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "404": { description: unknown, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

    delete:
      operationId: deleteUser
      summary: soft-delete the profile row and emit user.deleted
      x-required-permission: "user:delete:any"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: deleted, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeOK" } } } }
        "404": { description: unknown, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeFail" } } } }

components:
  schemas:
    EnvelopeMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }

    EnvelopeOK:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean }
        message: { type: string, maxLength: 255 }
        data: {}

    EnvelopeFail:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean }
        message: { type: string, maxLength: 255 }
        error: { type: string, maxLength: 120 }

    Profile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 120 }
        avatarUrl: { type: string, maxLength: 400, pattern: "^$|^https://" }
        status: { type: string, enum: [active, inactive, deleted] }
        lockedUntil: { type: string, format: date-time, nullable: true }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleSummary" }
        permissions:
          type: array
          items: { type: string, maxLength: 120 }
        online: { type: boolean }
        activeSessions: { type: integer }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        lastLoginIp: { type: string, maxLength: 45 }
        lastLoginUserAgent: { type: string, maxLength: 512 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RoleSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }

    UserStats:
      type: object
      required: [total, online, registrations]
      properties:
        total: { type: integer, format: int64 }
        online: { type: integer, format: int64 }
        registrations:
          type: array
          items:
            type: object
            required: [day, count]
            properties:
              day: { type: string, format: date }
              count: { type: integer, format: int64 }

    ProfileInput:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64, description: existing subject id }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 120 }
        avatarUrl: { type: string, maxLength: 400, pattern: "^$|^https://" }

    ProfileUpdateInput:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 120 }
        avatarUrl: { type: string, maxLength: 400, pattern: "^$|^https://" }

    ProductKind:
      type: string
      enum: [notification, invitation, access_request, delegation, api_key, webhook, scheduled_report, saved_view, role_template, compliance_report, branding, domain, billing_usage, broadcast, chat_message, onboarding, retention, consumer_quota, email_change, account_deletion]

    ProductRecord:
      type: object
      required: [id, kind, ownerId, name, status, payload, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/ProductKind" }
        ownerId: { type: integer, format: int64 }
        subjectId: { type: integer, format: int64, nullable: true }
        name: { type: string }
        status: { type: string }
        payload: { type: object, additionalProperties: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductRecordInput:
      type: object
      additionalProperties: false
      required: [kind, name, payload]
      properties:
        kind: { $ref: "#/components/schemas/ProductKind" }
        subjectId: { type: integer, format: int64, minimum: 1, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, maxLength: 40, default: active }
        payload: { type: object, additionalProperties: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    ProductRecordUpdate:
      type: object
      additionalProperties: false
      required: [status, payload]
      properties:
        status: { type: string, minLength: 1, maxLength: 40 }
        payload: { type: object, additionalProperties: true }

    TokenInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 512 }
